[project]
name = "av-analysis"
version = "0.1.0"
description = "Reconciliation, prespecified analysis and integrity monitoring (public code; synthetic data only)"
readme = "README.md"
requires-python = "==3.11.*"
# Every third-party dependency of the analysis stack (#33, #34, #35) is declared here, in
# the skeleton commit, so the three issues can be built in parallel without editing this
# file. No pandas: the tables are small (about 40,000 trial rows per study) and the
# stdlib csv module plus numpy/scipy keep parsing explicit, typed and platform-stable.
dependencies = [
    "av-schedules",
    "jsonschema>=4.23",
    "numpy>=2.1",
    "scipy>=1.14",
]

[project.scripts]
av-analysis = "av_analysis.cli:main"

[dependency-groups]
dev = [
    "hypothesis>=6.100",
    "mypy>=1.11",
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "scipy-stubs>=1.14",
    "types-jsonschema>=4.23",
]

[tool.uv.sources]
av-schedules = { path = "../schedules", editable = true }

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/av_analysis"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "ANN"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["ANN"]

[tool.ruff.lint.isort]
known-first-party = ["av_analysis"]

[tool.mypy]
python_version = "3.11"
files = ["src"]
strict = true
warn_unreachable = true

[tool.coverage.run]
source = ["av_analysis"]
branch = true

[tool.coverage.report]
# Interface stubs of #33, #34 and #35 raise NotImplementedError until implemented.
exclude_also = ["raise NotImplementedError", "if TYPE_CHECKING:"]
