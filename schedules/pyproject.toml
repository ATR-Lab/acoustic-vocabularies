[project]
name = "av-schedules"
version = "0.1.0"
description = "Curriculum, permutation and schedule generators (public code; synthetic DEMO fixtures only)"
readme = "README.md"
requires-python = "==3.11.*"
dependencies = []

[project.scripts]
av-schedules = "av_schedules.cli:main"

[dependency-groups]
dev = [
    "hypothesis>=6.100",
    "jsonschema>=4.23",
    "mypy>=1.11",
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/av_schedules"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "ANN"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["ANN"]

[tool.ruff.lint.isort]
known-first-party = ["av_schedules"]

[tool.mypy]
python_version = "3.11"
files = ["src"]
strict = true
warn_unreachable = true

[tool.coverage.run]
source = ["av_schedules"]
branch = true
