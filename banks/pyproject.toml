[project]
name = "av-banks"
version = "0.1.0"
description = "Study B candidate-bank builder: build, verify and amend dyad banks (16 atoms x 3 profiles)"
readme = "README.md"
requires-python = "==3.11.*"
license = { text = "Proprietary; see repository README" }
dependencies = [
    "av-generation",
    "av-sound",
    "jsonschema>=4.26.0",
]

[project.scripts]
banks = "av_banks.cli:main"

[dependency-groups]
dev = [
    "hypothesis>=6.100",
    "mypy>=1.10",
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "pytest-timeout>=2.3",
    "ruff>=0.6",
    "types-jsonschema>=4.23",
]

[tool.uv.sources]
av-sound = { path = "../sound", editable = true }
av-generation = { path = "../generation", editable = true }

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/av_banks"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "ANN"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["ANN"]
"**/tools/**" = ["ANN"]

[tool.ruff.lint.isort]
known-first-party = ["av_banks"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["numpy.*"]
follow_imports = "normal"

[tool.coverage.run]
source = ["av_banks"]
branch = true

[tool.coverage.report]
exclude_also = [
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "\\.\\.\\.$",
]
