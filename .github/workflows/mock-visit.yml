name: Mock visit evidence contracts
on:
  pull_request:
    paths:
      - 'tools/mock_visit/**'
      - 'tools/write_mock_run_manifest.py'
      - 'tests/test_mock_visit*.py'
      - 'tests/test_lesson_export.py'
      - 'apparatus/data/**'
      - 'schedules/examples/demo/**'
      - '.github/workflows/mock-visit.yml'
  push:
    branches: [main]
    paths:
      - 'tools/mock_visit/**'
      - 'tools/write_mock_run_manifest.py'
      - 'tests/test_mock_visit*.py'
      - 'tests/test_lesson_export.py'
      - 'apparatus/data/**'
      - 'schedules/examples/demo/**'
      - '.github/workflows/mock-visit.yml'
permissions:
  contents: read
jobs:
  contracts:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -p "test_mock_visit*.py"
      - run: python -m unittest discover -s tests -p "test_lesson_export.py"
