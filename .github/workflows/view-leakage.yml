name: View leakage verifier
on:
  pull_request:
    paths:
      - 'tools/view_leakage.py'
      - 'tools/leakage_png.py'
      - 'tests/test_view_leakage.py'
      - 'apparatus/schemas/view-leakage-plan.schema.json'
      - 'apparatus/spikes/O6.1.2/**'
      - 'tests/schema-fixtures.json'
      - '.github/workflows/view-leakage.yml'
      - 'isaac/reset/**'
      - 'isaac/snapshots/neutral_v1.json'
  push:
    branches: [main]
    paths:
      - 'tools/view_leakage.py'
      - 'tools/leakage_png.py'
      - 'tests/test_view_leakage.py'
      - 'apparatus/schemas/view-leakage-plan.schema.json'
      - 'apparatus/spikes/O6.1.2/**'
      - 'tests/schema-fixtures.json'
      - '.github/workflows/view-leakage.yml'
      - 'isaac/reset/**'
      - 'isaac/snapshots/neutral_v1.json'
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest tests/test_view_leakage.py tests/test_schemas.py -q
