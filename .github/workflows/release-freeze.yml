name: Release freeze tooling
on:
  pull_request:
    paths:
      - 'tools/release_freeze.py'
      - 'tools/release_freeze_verify.py'
      - 'tools/release_policy.py'
      - 'tools/repo_guard.py'
      - 'tools/quest_station.py'
      - 'tests/test_release_freeze.py'
      - 'docs/release/README.md'
      - '.gitattributes'
      - '.github/workflows/release-freeze.yml'
  push:
    branches: [main]
    paths:
      - 'tools/release_freeze.py'
      - 'tools/release_freeze_verify.py'
      - 'tools/release_policy.py'
      - 'tools/repo_guard.py'
      - 'tools/quest_station.py'
      - 'tests/test_release_freeze.py'
      - 'docs/release/README.md'
      - '.gitattributes'
      - '.github/workflows/release-freeze.yml'
permissions:
  contents: read
jobs:
  freeze-tooling:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest tests/test_release_freeze.py tests/test_repo_guard.py -q
