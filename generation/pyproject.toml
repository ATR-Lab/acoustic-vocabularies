[project]
name = "av-generation"
version = "0.1.0"
description = "Study A generation system and the shared generation contracts (proposers, ledger, orchestrator, rater panel, audit)"
readme = "README.md"
requires-python = "==3.11.*"
license = { text = "Proprietary; see repository README" }
# Every third-party dependency of #16-#28 is declared here once (skeleton commit), so
# implementers never edit this file or uv.lock. See docs/architecture.md, "Dependencies".
dependencies = [
    "av-sound",
    "fastapi>=0.115",
    "httpx>=0.27",
    "jsonschema>=4.26.0",
    "matplotlib>=3.9",
    "numpy>=2.0,<3",
    "pydantic>=2.8",
    "python-multipart>=0.0.9",
    "scipy>=1.13",
    "tokenizers>=0.20",
    "uvicorn>=0.30",
    "websockets>=13",
]

[dependency-groups]
dev = [
    "hypothesis>=6.100",
    "mypy>=1.10",
    "playwright>=1.47",
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "pytest-timeout>=2.3",
    "ruff>=0.6",
    "types-jsonschema>=4.23",
]

[tool.uv.sources]
av-sound = { path = "../sound", editable = true }

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/av_generation"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "ANN"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["ANN"]
"**/tools/**" = ["ANN"]

[tool.ruff.lint.isort]
known-first-party = ["av_generation"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["numpy.*"]
follow_imports = "normal"

[[tool.mypy.overrides]]
module = ["scipy.*"]
ignore_missing_imports = true

[tool.coverage.run]
source = ["av_generation"]
branch = true

[tool.coverage.report]
exclude_also = [
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "\\.\\.\\.$",
]
